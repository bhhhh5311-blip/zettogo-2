<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plush Toy Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background-color: #ffcc00; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        .product { border: 1px solid #ddd; border-radius: 8px; padding: 10px; text-align: center; }
        .shopping-cart { margin-top: 20px; }
        .hidden { display: none; }
        footer { text-align: center; padding: 20px; color: #666; border-top: 1px solid #ddd; margin-top: 40px; }
        @media (max-width: 600px) {
            .product { width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to the Plush Toy Store!</h1>
    </header>
    <div class="container">
        <h2>Featured Products</h2>
        <div class="product-list">
            <div class="product">
                <h3>Teddy Bear</h3>
                <p>Price: $19.99</p>
                <button onclick="addToCart('Teddy Bear', 19.99)">Add to Cart</button>
            </div>
            <div class="product">
                <h3>Unicorn Plush</h3>
                <p>Price: $24.99</p>
                <button onclick="addToCart('Unicorn Plush', 24.99)">Add to Cart</button>
            </div>
            <div class="product">
                <h3>Dinosaur Plush</h3>
                <p>Price: $29.99</p>
                <button onclick="addToCart('Dinosaur Plush', 29.99)">Add to Cart</button>
            </div>
        </div>
        <div class="shopping-cart">
            <h2>Shopping Cart</h2>
            <ul id="cart-items" class="hidden"></ul>
            <p id="total-price" class="hidden">Total: $0.00</p>
            <button onclick="checkout()" class="hidden">Checkout</button>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 Plush Toy Store. Designed by <strong>Zhihua & Dongxin</strong></p>
    </footer>
    <script>
        let cart = [];
        let total = 0;

        function addToCart(product, price) {
            cart.push({ product, price });
            total += price;
            displayCart();
        }

        function displayCart() {
            const cartItems = document.getElementById('cart-items');
            const totalPrice = document.getElementById('total-price');
            const checkoutButton = document.querySelector('button[onclick="checkout()"]');

            cartItems.innerHTML = '';
            cart.forEach(item => {
                const li = document.createElement('li');
                li.textContent = `${item.product} - $${item.price.toFixed(2)}`;
                cartItems.appendChild(li);
            });

            totalPrice.textContent = `Total: $${total.toFixed(2)}`;
            cartItems.classList.remove('hidden');
            totalPrice.classList.remove('hidden');
            checkoutButton.classList.remove('hidden');
        }

        function checkout() {
            alert(`Thank you for your purchase of $${total.toFixed(2)}!`);
            cart = [];
            total = 0;
            displayCart();
        }
    </script>
</body>
</html>
